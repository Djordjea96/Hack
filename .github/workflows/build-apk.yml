name: Napravi APK

# Pokreće se na svaki push na branč, ili ručno preko dugmeta "Run workflow".
on:
  push:
    branches:
      - claude/android-child-tracker-se0gzx
  workflow_dispatch:

permissions:
  contents: write   # potrebno da bi mogao da okači APK kao Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Podesi Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Podesi Android SDK
        uses: android-actions/setup-android@v3

      - name: Podesi Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Napravi debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Sačuvaj APK kao artifact
        uses: actions/upload-artifact@v4
        with:
          name: gde-mi-je-auto-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Objavi APK kao Release (lak za skidanje na telefon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gde-mi-je-auto.apk
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest gde-mi-je-auto.apk \
            --title "Gde mi je auto (najnovija verzija)" \
            --notes "Automatski napravljen APK. Skini fajl 'gde-mi-je-auto.apk' na telefon i instaliraj ga."
